server:
  port: 8084

spring:
  application:
    name: auction-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${AUCTION_DB:biddy_auction}
    username: ${POSTGRES_USER:biddy}
    password: ${POSTGRES_PASSWORD:biddy1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: auction-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# Transactional Outbox Pattern Configuration
outbox:
  scheduler:
    enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    delay: ${OUTBOX_SCHEDULER_DELAY:200}  # 실시간 projection 지연을 줄이기 위한 폴링 주기 (ms)
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-batches-per-run: ${OUTBOX_MAX_BATCHES_PER_RUN:10}
    max-retry-count: ${OUTBOX_MAX_RETRY_COUNT:5}  # 최대 재시도 횟수
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT:10}  # Kafka 발행 타임아웃 (초)

# 실시간 입찰 개선 단계별 전환 플래그
# 기본값은 안전한 단계 전환을 위해 기존 direct 경로를 유지한다.
# projection 검증 후 BID_REDIS_PROJECTION_ENABLED=true, BID_WEBSOCKET_SOURCE=redis 순으로 전환한다.
bid:
  execution-mode: ${BID_EXECUTION_MODE:optimistic}
  websocket-source: ${BID_WEBSOCKET_SOURCE:direct}
  api-v2:
    enabled: ${BID_API_V2_ENABLED:false}
  redis-projection:
    enabled: ${BID_REDIS_PROJECTION_ENABLED:false}
    consumer-group: ${BID_REDIS_PROJECTION_CONSUMER_GROUP:auction-bid-projection}
