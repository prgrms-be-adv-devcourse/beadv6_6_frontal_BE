# payment는 apigateway와 정산 CronJob에서만 접근 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-allow-apigateway-and-settlement-batch
spec:
  podSelector:
    matchLabels:
      app: payment
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apigateway
        - podSelector:
            matchLabels:
              app: settlement-batch
      ports:
        - protocol: TCP
          port: 8085
